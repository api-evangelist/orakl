openapi: 3.1.0
info:
  title: Orakl Oncology public website CommonContent Login Check API
  description: Orakl Oncology public website API
  version: 1.0.7
servers:
- url: /
  description: ''
security: []
tags:
- name: Login Check
paths:
  /api/token:
    post:
      operationId: login_check_post
      tags:
      - Login Check
      responses:
        '200':
          description: User token created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    readOnly: true
                    type: string
                    nullable: false
                required:
                - token
      summary: Creates a user token.
      description: Creates a user token.
      requestBody:
        description: The login data
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  nullable: false
                password:
                  type: string
                  nullable: false
              required:
              - username
              - password
        required: true
components:
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
