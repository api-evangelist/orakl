          type: boolean
        fieldsNames:
          readOnly: true
          description: 'Get every node-type fields names in

            a simple array.'
          type: array
          items:
            type:
            - string
            - 'null'
        fieldsLabels:
          readOnly: true
          description: 'Get every node-type fields names in

            a simple array.'
          type: array
          items:
            type:
            - string
            - 'null'
        oneLineSummary:
          readOnly: true
          type: string
        retentionTimeInterval:
          readOnly: true
          type:
          - string
          - 'null'
          format: duration
        fieldsSummary:
          readOnly: true
          type: string
      required:
      - name
      - displayName
      - email
    CustomForm:
      type: object
      description: 'CustomForms describe each node structure family,

        They are mandatory before creating any Node.'
      properties:
        color:
