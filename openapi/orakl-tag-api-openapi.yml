components:
  schemas:
    Tag.x-www-form-urlencoded-tag_base:
      type: object
      description: Tags are hierarchical entities used to qualify Nodes.
      properties:
        visible:
          description: Is this tag visible in website?
          default: true
          example: 'true'
          type: boolean
        slug:
          readOnly: true
          description: Unique tag name (slug) used to build content URL or filter queries.
          example: this-is-a-tag-name
          type: string
    HydraCollectionBaseSchemaNoPagination:
      type: object
      properties:
        hydra:totalItems:
          type: integer
          minimum: 0
        hydra:search:
          type: object
          properties:
            '@type':
              type: string
            hydra:template:
              type: string
            hydra:variableRepresentation:
              type: string
            hydra:mapping:
              type: array
              items:
                type: object
                properties:
                  '@type':
                    type: string
                  variable:
                    type: string
                  property:
                    type:
                    - string
                    - 'null'
                  required:
                    type: boolean
    HydraItemBaseSchema:
      type: object
      properties:
        '@context':
          oneOf:
          - type: string
          - type: object
            properties:
              '@vocab':
                type: string
              hydra:
                type: string
                enum:
                - http://www.w3.org/ns/hydra/core#
            required:
            - '@vocab'
            - hydra
            additionalProperties: true
        '@id':
          type: string
        '@type':
          type: string
      required:
      - '@id'
      - '@type'
    HydraCollectionBaseSchema:
      allOf:
      - $ref: '#/components/schemas/HydraCollectionBaseSchemaNoPagination'
      - type: object
        properties:
          hydra:view:
            type: object
            properties:
              '@id':
                type: string
                format: iri-reference
              '@type':
                type: string
              hydra:first:
                type: string
                format: iri-reference
              hydra:last:
                type: string
                format: iri-reference
              hydra:previous:
                type: string
                format: iri-reference
              hydra:next:
                type: string
                format: iri-reference
            example:
              '@id': string
              '@type': string
              hydra:first: string
              hydra:last: string
              hydra:previous: string
              hydra:next: string
    Tag-tag_base:
      type: object
      description: Tags are hierarchical entities used to qualify Nodes.
      properties:
        visible:
          description: Is this tag visible in website?
          default: true
          example: 'true'
          type: boolean
        slug:
          readOnly: true
          description: Unique tag name (slug) used to build content URL or filter queries.
          example: this-is-a-tag-name
          type: string
    Tag.jsonld-tag_base:
      allOf:
      - $ref: '#/components/schemas/HydraItemBaseSchema'
      - type: object
        properties:
          visible:
            description: Is this tag visible in website?
            default: true
            example: 'true'
            type: boolean
          slug:
            readOnly: true
            description: Unique tag name (slug) used to build content URL or filter queries.
            example: this-is-a-tag-name
            type: string
      description: Tags are hierarchical entities used to qualify Nodes.
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
