openapi: 3.1.0
info:
  title: Orakl Oncology public website CommonContent Tag API
  description: Orakl Oncology public website API
  version: 1.0.7
servers:
- url: /
  description: ''
security: []
tags:
- name: Tag
  description: Tags are hierarchical entities used to qualify Nodes.
paths:
  /api/tags:
    get:
      operationId: api_tags_get_collection
      tags:
      - Tag
      responses:
        '200':
          description: Tag collection
          content:
            application/ld+json:
              schema:
                type: object
                description: Tag.jsonld-tag_base collection.
                allOf:
                - $ref: '#/components/schemas/HydraCollectionBaseSchema'
                - type: object
                  required:
                  - hydra:member
                  properties:
                    hydra:member:
                      type: array
                      items:
                        $ref: '#/components/schemas/Tag.jsonld-tag_base'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag-tag_base'
            application/x-www-form-urlencoded:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag.x-www-form-urlencoded-tag_base'
        '401':
          description: Invalid JWT Token
      summary: Retrieves the collection of Tag resources.
      description: Retrieves the collection of Tag resources.
      parameters:
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        schema:
          type: integer
          default: 1
        style: form
        explode: false
      - name: itemsPerPage
        in: query
        description: The number of items per page
        required: false
        deprecated: false
        schema:
          type: integer
          default: 15
          minimum: 0
          maximum: 50
        style: form
        explode: false
      - name: properties[]
        in: query
        description: 'Allows you to reduce the response to contain only the properties you need. If your desired property is nested, you can address it using nested arrays. Example: properties[]={propertyName}&properties[]={anotherPropertyName}&properties[{nestedPropertyParent}][]={nestedProperty}'
        required: false
        deprecated: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: nodesTags
        in: query
        description: Filter tags if they are related to any node or not.
        required: false
        deprecated: false
        schema:
          type: boolean
        style: form
        explode: false
      - name: nodesTags[visible]
        in: query
        description: Filter tags if they are related to any visible node.
        required: false
        deprecated: false
        schema:
          type: boolean
        style: form
        explode: false
      - name: nodesTags[nodeTypeName]
        in: query
        description: Filter tags if they are related to any node of `nodeTypeName`.
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: nodesTags[nodeTypeName][]
        in: query
        description: Filter tags if they are related to any node of `nodeTypeName`.
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: nodesTags[tagName]
        in: query
        description: Filter tags if they are related to any node which is linked to another `tagName`.
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: nodesTags[tagName][]
        in: query
        description: Filter tags if they are related to any node which is linked to another `tagName`.
        required: false
        deprecated: false
        schema:
          type: string
