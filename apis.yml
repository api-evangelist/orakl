name: Orakl
description: >-
  Orakl Oncology is a Paris-based TechBio company, a spin-off from the Gustave
  Roussy cancer institute, building an AI-powered drug-development platform that
  combines one of the largest biobanks of patient tumor avatars (organoids) with
  deep clinical and omics data and machine learning to predict how individual
  patients will respond to new cancer drug candidates. Its commercial products
  O-Predict and O-Validate deliver actionable response predictions to drug
  developers across clinical trials. This API Evangelist profile documents the
  public website API (an API Platform / Roadiz headless-CMS Hydra + JSON-LD
  surface with JWT authentication) that powers orakl-oncology.com.
